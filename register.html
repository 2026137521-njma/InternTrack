<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="InternTrack internship placement and application tracker">
<title>Register | InternTrack</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet">
</head>
<body data-page="register">
<main>
<div class="card panel auth shadow-sm">
<div class="card-body p-3">
<div class="text-center mb-4">
<div class="initial">IT</div>
<h1 class="h3 fw-bold">Create account</h1>
<p class="muted">InternTrack student and employer portal</p>
</div>
<div id="message" role="alert">
</div>
<form id="authForm">
<div class="mb-3">
<label for="name" class="form-label fw-semibold">Full name</label>
<input class="form-control form-control-lg" id="name" type="text" required>
</div>
<div class="mb-3">
<label for="email" class="form-label fw-semibold">Email address</label>
<input class="form-control form-control-lg" id="email" type="email" required>
</div>
<div class="mb-3">
<label for="password" class="form-label fw-semibold">Password</label>
<input class="form-control form-control-lg" id="password" type="password" required>
</div>
<button class="btn btn-primary primary" type="submit">Register</button>
</form>
<p class="text-center">Already registered? <a href="index.html">Sign in</a>
</p>
</div>
</div>
</main>
<footer>InternTrack | Internship Management</footer>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.8/dist/chart.umd.min.js">
</script>
<script src="data.js">
</script>
<script src="app.js">
</script>
</body>
</html>
