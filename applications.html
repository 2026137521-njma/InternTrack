<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="InternTrack internship placement and application tracker">
<title>Applications | InternTrack</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet">
</head>
<body data-page="applications">
<header>
<a class="brand" href="dashboard.html">Intern<span>Track</span>
</a>
<nav id="nav">
</nav>
</header>
<main>
<h1>My Applications</h1>
<section class="panel entry">
<h2>New application</h2>
<form id="applyForm">
<label for="company">Company</label>
<select id="company" required>
</select>
<label for="position">Position</label>
<select id="position" required>
</select>
<button class="btn btn-primary primary">Submit application</button>
</form>
<div id="message" role="alert">
</div>
</section>
<section class="panel">
<h2>Application history</h2>
<div id="records" class="tablewrap">
</div>
</section>
</main>
<footer>InternTrack | Internship Management</footer>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.8/dist/chart.umd.min.js">
</script>
<script src="data.js">
</script>
<script src="app.js">
</script>
</body>
</html>
