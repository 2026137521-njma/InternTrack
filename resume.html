<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="InternTrack internship placement and application tracker">
<title>Resume | InternTrack</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet">
</head>
<body data-page="resume">
<header>
<a class="brand" href="dashboard.html">Intern<span>Track</span>
</a>
<nav id="nav">
</nav>
</header>
<main>
<h1>My Resume</h1>
<section class="panel entry">
<p>Upload a sample PDF resume (maximum 1 MB). Stored in this browser only.</p>
<form id="resumeForm">
<label for="pdf">PDF resume</label>
<input id="pdf" type="file" accept="application/pdf,.pdf" required>
<button class="btn btn-primary primary">Upload resume</button>
</form>
<div id="message" role="alert">
</div>
<div id="currentResume">
</div>
</section>
</main>
<footer>InternTrack | Internship Management</footer>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.8/dist/chart.umd.min.js">
</script>
<script src="data.js">
</script>
<script src="app.js">
</script>
</body>
</html>
